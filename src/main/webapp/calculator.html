<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1: Máy tính cộng trừ</title>
</head>
<body>
    <h2>Bài 1: Máy tính cộng trừ (POST)</h2>
    <form action="CalculatorServlet" method="post">
        Số A: <input type="number" name="a"><br><br>
        Số B: <input type="number" name="b"><br><br>
        Phép toán: 
        <select name="op">
            <option value="+">+</option>
            <option value="-">-</option>
        </select><br><br>
        <button type="submit">Tính</button>
    </form>
    <br>
    <a href="index.html">Quay lại trang chủ</a>
</body>
</html>
